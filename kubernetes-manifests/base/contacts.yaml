apiVersion: apps/v1
kind: Deployment
metadata:
  name: contacts
  namespace: circle-banking-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contacts
  template:
    metadata:
      labels:
        app: contacts
    spec:
      serviceAccountName: circle-banking-app-sa
      containers:
      - name: contacts
        image: circle-banking-app/contacts:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: environment-config
        env:
        - name: VERSION
          value: "0.1.0"
        volumeMounts:
        - name: jwt-keys
          mountPath: /tmp/.ssh
          readOnly: true
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 384Mi
      volumes:
      - name: jwt-keys
        secret:
          secretName: jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: contacts
  namespace: circle-banking-app
spec:
  selector:
    app: contacts
  ports:
  - port: 8080
    targetPort: 8080
