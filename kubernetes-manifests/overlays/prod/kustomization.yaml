apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: environment-config
    patch: |
      - op: replace
        path: /data/DYNAMODB_USERS_TABLE
        value: bankcorp-users-prod
      - op: replace
        path: /data/DYNAMODB_CONTACTS_TABLE
        value: bankcorp-contacts-prod
      - op: replace
        path: /data/DYNAMODB_TRANSACTIONS_TABLE
        value: bankcorp-transactions-prod
      - op: replace
        path: /data/DYNAMODB_BALANCES_TABLE
        value: bankcorp-balances-prod
  - target:
      kind: Ingress
      name: main-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: app.bankapp.example.com
      - op: replace
        path: /spec/rules/1/host
        value: grafana.bankapp.example.com
      - op: replace
        path: /spec/rules/2/host
        value: hubble.bankapp.example.com

replicas:
  - name: frontend
    count: 2
