version: 2.1
orbs:
  maven: circleci/maven@1.4
  aws-cli: circleci/aws-cli@5.3

parameters:
  ecr_registry:
    type: string
    default: ""
    description: "ECR registry URI (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com)"
  eks_cluster_name:
    type: string
    default: ""
    description: "EKS cluster name to deploy to"
  aws_region:
    type: string
    default: "us-east-1"
    description: "AWS region of the EKS cluster and ECR registry"
  k8s_namespace:
    type: string
    default: "cba"
    description: "Kubernetes namespace to deploy into"
  app_environment:
    type: string
    default: "dev"
    description: "Application environment (dev or prod)"
  aws_role_arn:
    type: string
    default: ""
    description: "AWS IAM Role ARN to assume via OIDC"
  e2e_base_url:
    type: string
    default: ""
    description: "Base URL for E2E tests (if empty, derived from ALB after deploy)"

executors:
  with-chrome:
    docker:
      - image: 'cypress/browsers:node-22.14.0-chrome-133.0.6943.126-1-ff-135.0.1-edge-133.0.3065.82-1'

  base:
    docker:
      - image: cimg/deploy:2024.03

  jdk17:
    docker:
      - image: cimg/openjdk:17.0.3
    resource_class: xlarge

  python38:
    docker:
      - image: cimg/python:3.8


jobs:
  python-checkstyle:
    executor: python38
    steps:
      - checkout
      - run: pip install pylint
      - run:
          name: Lint Python
          command: pylint --rcfile=./.pylintrc ./src/*/*.py

  python-test:
    executor: python38
    steps:
      - checkout
      - run: mkdir test-reports
      - run:
          name: Test Python Services
          command: |
            for SERVICE in "contacts" "userservice"; do
              echo "testing $SERVICE..."
              pushd src/$SERVICE
                python3 -m venv $HOME/venv-$SERVICE
                source $HOME/venv-$SERVICE/bin/activate
                pip install --upgrade pip
                pip install -r requirements.txt
                TEST_FILES=$(circleci tests glob "tests/test_*.py")
                echo $TEST_FILES | circleci tests run --command="xargs python -m pytest -o junit_family=legacy --junit-xml=../../test-reports/report-${SERVICE}.xml -v -p no:warnings" --verbose --split-by=timings
                deactivate
              popd
            done
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: test-reports

  python-test-parallel:
    executor: python38
    parallelism: 2
    steps:
      - checkout
      - run: mkdir test-reports
      - run:
          name: Test Python Services
          command: |
            MODULES=("contacts" "userservice")
            MY_MODULES=`printf '%s\n' "${MODULES[@]}" | circleci tests split`
            echo "Running modules ${MY_MODULES[@]}"
            for MOD in "${MY_MODULES[@]}"; do
                pushd src/$MOD >/dev/null
                python3 -m venv $HOME/venv-$MOD
                source $HOME/venv-$MOD/bin/activate
                pip install --upgrade pip
                pip install -r requirements.txt
                python -m pytest tests --junit-xml=../../test-reports/report-${MOD}.xml -v -p no:warnings
                deactivate
                popd >/dev/null
            done
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: test-reports

  java-checkstyle:
    executor: jdk17
    steps:
      - checkout
      - maven/with_cache:
          verify_dependencies: false
          steps:
          - run: ./mvnw checkstyle:check

  java-test-and-code-cov:
    executor: jdk17
    steps:
      - checkout
      - run: mkdir test-reports
      - restore_cache:
          keys:
            - v2-mvn-full-{{ .Branch }}
            - v2-mvn-full-
      - run: mvn dependency:go-offline
      - save_cache:
          key: v2-mvn-full-{{ .Branch }}
          paths:
            - ~/.m2
      - run:
          environment:
            PARAM_IT_PATTERN: '**/*IT*.java'
            PARAM_TEST_DIR: 'src/**/src/test/java'
            PARAM_TEST_PATTERN: '**/*Test*.java'
          name: Parallel and Selected Tests
          command: |
            mkdir -p .circleci/tests/
            circleci tests glob 'src/**/src/test/java/**/*Test*.java' | \
                sed -e 's#^src/[a-z]*/src/test/java/\(.*\).java#\1#' | \
                tr "/" "." > .circleci/tests/surefire_classnames
            cat .circleci/tests/surefire_classnames | circleci tests run --command 'tr " " "," | xargs -I {} ./mvnw -B  -DfailIfNoTests=false -Dtest={} test' --verbose --split-by=timings
      - run:
          name: Aggregate all module tests
          when: always
          command: |
            for SERVICE in "balancereader" "ledgerwriter" "transactionhistory"; do
            echo "checking $SERVICE..."
            cp src/$SERVICE/target/surefire-reports/*.xml test-reports || echo "No tests for this node"
            done
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: test-reports
      - store_artifacts:
          path: .circleci/tests/

  skaffold-build-push:
    executor: jdk17
    steps:
      - checkout
      - aws-cli/setup:
          region: << pipeline.parameters.aws_region >>
          role_arn: << pipeline.parameters.aws_role_arn >>
      - run:
          name: Install Skaffold
          command: |
            curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64 && \
            sudo install skaffold /usr/local/bin/
      - setup_remote_docker:
          docker_layer_caching: true
      - restore_cache:
          keys:
            - v2-mvn-full-{{ .Branch }}
            - v2-mvn-full-
      - restore_cache:
          keys:
            - v1-skaffold-{{ .Branch }}
            - v1-skaffold-
      - run:
          name: Login to ECR and build images
          command: |
            aws ecr get-login-password --region << pipeline.parameters.aws_region >> | \
              docker login --username AWS --password-stdin << pipeline.parameters.ecr_registry >>
            ./mvnw jib:_skaffold-fail-if-jib-out-of-date -Djib.requiredVersion=3.2.1 --projects src/ledgerwriter --also-make jib:_skaffold-files-v2 --quiet --batch-mode
            echo "Jib ready"
            mkdir output
            skaffold build --build-concurrency=4 --default-repo=<< pipeline.parameters.ecr_registry >> --file-output=output/tags.json
      - save_cache:
          key: v1-skaffold-{{ .Branch }}
          paths:
            - ~/.skaffold/cache
      - persist_to_workspace:
          root: output
          paths: [ 'tags.json' ]

  deploy:
    executor: base
    environment:
      APP_ENV: << pipeline.parameters.app_environment >>
    steps:
      - checkout
      - aws-cli/setup:
          region: << pipeline.parameters.aws_region >>
          role_arn: << pipeline.parameters.aws_role_arn >>
      - run:
          name: Configure kubectl for EKS
          command: |
            aws eks update-kubeconfig \
              --name << pipeline.parameters.eks_cluster_name >> \
              --region << pipeline.parameters.aws_region >>
            kubectl get serviceaccounts -n << pipeline.parameters.k8s_namespace >>
      - attach_workspace:
          at: output
      - run:
          name: Deploy CCI Bank Corp Services
          command: |
            curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64 && \
            sudo install skaffold /usr/local/bin/
            export APP_VERSION="0.1.<< pipeline.number >>"
            export CIRCLE_PIPELINE_ID=<< pipeline.id >>
            cat .circleci/release_tracking/kustomization.yaml | circleci env subst > dev-kubernetes-manifests/kustomization.yaml
            cat .circleci/release_tracking/template_patch.yaml | circleci env subst > dev-kubernetes-manifests/template_patch.yaml
            kubectl kustomize dev-kubernetes-manifests > dev-kubernetes-manifests/frontend-annotated.yaml
            skaffold deploy \
              --default-repo=<< pipeline.parameters.ecr_registry >> \
              --namespace=<< pipeline.parameters.k8s_namespace >> \
              --build-artifacts=output/tags.json
      - run:
          name: Wait for deployment
          command: |
            kubectl rollout status deployment/frontend \
              -n << pipeline.parameters.k8s_namespace >> \
              --timeout=120s
      - run:
          name: Print Frontend URL
          command: |
            echo "--- Frontend Service ---"
            kubectl get service frontend -n << pipeline.parameters.k8s_namespace >>
            echo ""
            echo "--- Ingress (ALB endpoint) ---"
            kubectl get ingress frontend-ingress -n << pipeline.parameters.k8s_namespace >> -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "No ingress found"

  e2e:
    executor: with-chrome
    steps:
      - checkout
      - run:
          name: Run Cypress Tests
          command: |
            URL="<< pipeline.parameters.e2e_base_url >>"
            if [ -z "${URL}" ]; then
              echo "No e2e_base_url parameter set. Skipping E2E tests."
              echo "Set the e2e_base_url pipeline parameter to the ALB hostname to run tests."
              exit 0
            fi
            echo "Testing against ${URL}"
            cd ui-tests
            npx cypress run \
            --config baseUrl=${URL} \
            --browser firefox \
            --reporter junit \
            --reporter-options "mochaFile=results/my-test-output-[hash].xml"
      - store_test_results:
          path: ui-tests/results
      - store_artifacts:
          path: ui-tests/cypress/videos
      - store_artifacts:
          path: ui-tests/cypress/screenshots

workflows:
  build-test-deploy:
    jobs:
      - java-checkstyle
      - java-test-and-code-cov
      - python-checkstyle
      - python-test
      - python-test-parallel
      - skaffold-build-push:
          context: [aws-oidc]
          requires: []
      - deploy:
          name: Deploy
          context: [aws-oidc]
          requires:
            - skaffold-build-push
            - python-test
            - java-test-and-code-cov
      - e2e:
          name: E2E Tests
          requires:
            - Deploy
