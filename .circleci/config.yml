version: 2.1
orbs:
  maven: circleci/maven@1.4

parameters:
  force-failure:
    type: boolean
    default: false
    description: >
      Demo toggle. When true, integration-check fails on purpose so we can walk
      the build-failure debugging story (logs, SSH, MCP). Default false = green.

executors:
  jdk17:
    docker:
      - image: cimg/openjdk:17.0.3
    resource_class: xlarge

  python38:
    docker:
      - image: cimg/python:3.8

  docker-builder:
    docker:
      - image: cimg/base:current

jobs:
  python-checkstyle:
    executor: python38
    steps:
      - checkout
      - run: pip install pylint
      - run:
          name: Lint Python
          command: pylint --rcfile=./.pylintrc ./src/*/*.py

  # Python unit tests with pip download caching — turns a cold dependency
  # install into a warm one on rerun. Build-time lever #1 for the Python side.
  python-test:
    executor: python38
    steps:
      - checkout
      - run: mkdir test-reports
      - restore_cache:
          keys:
            - v1-pip-{{ checksum "src/contacts/requirements.txt" }}-{{ checksum "src/userservice/requirements.txt" }}
            - v1-pip-
      - run:
          name: Test Python Services
          command: |
            for SERVICE in "contacts" "userservice"; do
              echo "testing $SERVICE..."
              pushd src/$SERVICE
                python3 -m venv $HOME/venv-$SERVICE
                source $HOME/venv-$SERVICE/bin/activate
                pip install --upgrade pip
                pip install -r requirements.txt
                #CLI wraps test runner to allow "rerun failed tests only"
                TEST_FILES=$(circleci tests glob "tests/test_*.py")
                echo $TEST_FILES | circleci tests run --command="xargs python -m pytest -o junit_family=legacy --junit-xml=../../test-reports/report-${SERVICE}.xml -v -p no:warnings" --verbose --split-by=timings
                deactivate
              popd
            done
      - save_cache:
          key: v1-pip-{{ checksum "src/contacts/requirements.txt" }}-{{ checksum "src/userservice/requirements.txt" }}
          paths:
            - ~/.cache/pip
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: test-reports

  # Same suite fanned across 2 containers via test splitting — the
  # parallelization answer for Propel's slow legacy tests.
  python-test-parallel:
    executor: python38
    parallelism: 2 #match number of python services
    steps:
      - checkout
      - run: mkdir test-reports
      - run:
          name: Test Python Services
          command: |
            MODULES=("contacts" "userservice")
            MY_MODULES=`printf '%s\n' "${MODULES[@]}" | circleci tests split`
            echo "Running modules ${MY_MODULES[@]}"
            for MOD in "${MY_MODULES[@]}"; do
                pushd src/$MOD >/dev/null
                python3 -m venv $HOME/venv-$MOD
                source $HOME/venv-$MOD/bin/activate
                pip install --upgrade pip
                pip install -r requirements.txt
                #CLI wraps test runner to allow "rerun failed tests only"
                python -m pytest tests --junit-xml=../../test-reports/report-${MOD}.xml -v -p no:warnings
                deactivate
                popd >/dev/null
            done
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: test-reports

  java-checkstyle:
    executor: jdk17
    steps:
      - checkout
      - maven/with_cache:
          verify_dependencies: false
          steps:
          - run: ./mvnw checkstyle:check

  # Java tests with ~/.m2 caching + timing-based test splitting. The cache is
  # the headline build-time lever (the 40-min legacy build story); splitting +
  # rerun-failed-only is the smarter-testing beat.
  java-test-and-code-cov:
    executor: jdk17
    steps:
      - checkout
      - run: mkdir test-reports
      - restore_cache:
          keys:
            - v2-mvn-full-{{ .Branch }}
            - v2-mvn-full-
      - run: mvn dependency:go-offline
      - save_cache:
          key: v2-mvn-full-{{ .Branch }}
          paths:
            - ~/.m2
      - run:
          environment:
            PARAM_IT_PATTERN: '**/*IT*.java'
            PARAM_TEST_DIR: 'src/**/src/test/java'
            PARAM_TEST_PATTERN: '**/*Test*.java'
          name: Parellel and Selected Tests
          command: |
            echo -e "\033[31m\033[4mNotes on Test Splitting & Re-running failed tests only \033[0m
                    \033[34mCaveat 1:\033[0m  CircleCI Test Splitting uses filename by default, but JUnit reports use class names.
                    Therefore this uses naive translation of linux file paths to dot separated package names and strips the .java suffix.
                    \033[34mCaveat 2:\033[0m  Because we "skip" tests on re-runs, Maven will fail by default without `-DfailIfNoTests=false`
                    \033[34mDebugging:\033[0m This will place all files used to decide tests in .circleci/tests and export it as an artifact for inspection/debugging.
                    "
            mkdir -p .circleci/tests/
            #convert file names to classnames
            circleci tests glob 'src/**/src/test/java/**/*Test*.java' | \
                sed -e 's#^src/[a-z]*/src/test/java/\(.*\).java#\1#' | \
                tr "/" "." > .circleci/tests/surefire_classnames
            #pass classnames to CircleCI CLI as test wrapper
            cat .circleci/tests/surefire_classnames | circleci tests run --command 'tr " " "," | xargs -I {} ./mvnw -B  -DfailIfNoTests=false -Dtest={} test' --verbose --split-by=timings
      - run:
          name: aggregate all module tests
          when: always
          command: |
            for SERVICE in "balancereader" "ledgerwriter" "transactionhistory"; do
            echo "checking $SERVICE..."
            cp src/$SERVICE/target/surefire-reports/*.xml test-reports || echo "No tests for this node"
            done
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: test-reports
      - store_artifacts:
          path: .circleci/tests/

  # ---- Docker image build: control vs Docker Layer Caching ----
  # Both build a deliberately heavy demo image (src/frontend/Dockerfile.demo):
  # an apt toolchain layer + source-compiled Postgres/uWSGI deps. That slow
  # dependency layer is what DLC caches. Build-only, no push, so nothing
  # external can break mid-demo. Pre-warm once before the demo, then a fresh run
  # shows the DLC job collapse next to the cold control in the same workflow.
  #
  # DOCKER_BUILDKIT=0 forces the classic builder on purpose: DLC persists the
  # daemon's layer store (/var/lib/docker), which the classic builder uses, so
  # cache hits are reliable. BuildKit keeps its cache elsewhere that DLC does
  # not persist, so BuildKit builds come back cold every run (measured).
  build-image-nocache:
    executor: docker-builder
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build frontend image (control, no layer cache)
          command: |
            START=$(date +%s)
            DOCKER_BUILDKIT=0 docker build -f src/frontend/Dockerfile.demo -t banking-frontend:${CIRCLE_SHA1} src/frontend
            echo "Build (no cache) took $(( $(date +%s) - START ))s"

  build-image-dlc:
    executor: docker-builder
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build frontend image (Docker Layer Caching)
          command: |
            START=$(date +%s)
            DOCKER_BUILDKIT=0 docker build -f src/frontend/Dockerfile.demo -t banking-frontend:${CIRCLE_SHA1} src/frontend
            echo "Build (DLC) took $(( $(date +%s) - START ))s"

  # ---- Build once, reuse downstream ----
  # package-service compiles a real Spring Boot jar once and persists it to the
  # workspace. reuse-service attaches it and proves (sha256) the SAME artifact
  # is reused — no recompile. Maps to Propel's interdependent legacy builds.
  package-service:
    executor: jdk17
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-mvn-full-{{ .Branch }}
            - v2-mvn-full-
      - run:
          name: Package ledgerwriter (compile once)
          command: |
            ./mvnw -B -pl src/ledgerwriter -am package -DskipTests
            mkdir -p workspace
            JAR=$(ls src/ledgerwriter/target/*.jar | head -1)
            cp "${JAR}" workspace/ledgerwriter.jar
            sha256sum workspace/ledgerwriter.jar | awk '{print $1}' > workspace/ledgerwriter.jar.sha256
            echo "Built $(basename "${JAR}") -> workspace/ledgerwriter.jar"
            cat workspace/ledgerwriter.jar.sha256
      - persist_to_workspace:
          root: workspace
          paths:
            - ledgerwriter.jar
            - ledgerwriter.jar.sha256
      - store_artifacts:
          path: workspace/ledgerwriter.jar

  reuse-service:
    executor: docker-builder
    steps:
      - attach_workspace:
          at: /tmp/ws
      - run:
          name: Reuse the compiled jar (no rebuild)
          command: |
            EXPECTED=$(cat /tmp/ws/ledgerwriter.jar.sha256)
            ACTUAL=$(sha256sum /tmp/ws/ledgerwriter.jar | awk '{print $1}')
            echo "expected sha256: ${EXPECTED}"
            echo "actual   sha256: ${ACTUAL}"
            if [ "${EXPECTED}" != "${ACTUAL}" ]; then
              echo "FAIL: artifact changed since package-service — a rebuild happened" >&2
              exit 1
            fi
            echo "OK: identical jar reused from package-service — no recompile"

  # ---- Build-failure debugging demo ----
  # Default GREEN. Trigger the pipeline with force-failure=true to make this job
  # fail on purpose, then walk the debug story: failing step -> logs -> SSH ->
  # get_build_failure_logs via the CircleCI MCP inside the IDE.
  integration-check:
    executor: docker-builder
    steps:
      - checkout
      - run:
          name: Integration checks
          command: |
            if [ "<< pipeline.parameters.force-failure >>" = "true" ]; then
              echo "Running integration checks against ledger services..."
              echo "  contacts           ... ok"
              echo "  userservice        ... ok"
              echo "  transactionhistory ... ok"
              echo "  ledgerwriter       ... FAILED"
              echo ""
              echo "TransactionValidationTest.testInsufficientFunds:142"
              echo "  expected an overdraft to be DECLINED, but the transaction was APPROVED"
              echo "  java.lang.AssertionError: expected:<DECLINED> but was:<APPROVED>"
              echo ""
              echo "Integration checks FAILED (1 of 4 services)"
              exit 1
            fi
            echo "All integration checks passed"

workflows:
  main:
    jobs:
      - java-checkstyle:
          context: [ compass-integration-bank-of-aion ]
      - java-test-and-code-cov
      - python-checkstyle
      - python-test
      - python-test-parallel
      - build-image-nocache
      - build-image-dlc
      - package-service
      - reuse-service:
          requires:
            - package-service
      - integration-check
