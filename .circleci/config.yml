version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1

parameters:
  ecr_registry:
    type: string
    default: "992382483259.dkr.ecr.us-east-1.amazonaws.com"
  eks_cluster_name:
    type: string
    default: "fe-runner-cluster"
  aws_region:
    type: string
    default: "us-east-1"
  k8s_namespace:
    type: string
    default: "bankcorp"
  domain:
    type: string
    default: "bankapp.example.com"
  app_environment:
    type: string
    default: "dev"
  aws_ci_role_arn:
    type: string
    default: "arn:aws:iam::992382483259:role/fieldeng_aws_ci_oidc_oauth_role"
  app_role_arn:
    type: string
    default: "arn:aws:iam::992382483259:role/fe-runner-cluster-app-dynamodb"
  acm_cert_arn:
    type: string
    default: ""

executors:
  with-chrome:
    docker:
      - image: cypress/browsers:node-22.14.0-chrome-133.0.6943.126-1-ff-135.0.1-edge-133.0.3065.82-1
  aws:
    docker:
      - image: cimg/aws:2024.03
  go:
    docker:
      - image: cimg/go:1.22
  python:
    docker:
      - image: cimg/python:3.10
  terraform:
    docker:
      - image: hashicorp/terraform:1.7

commands:
  aws-setup:
    steps:
      - aws-cli/setup:
          region: << pipeline.parameters.aws_region >>
          role_arn: << pipeline.parameters.aws_ci_role_arn >>
          role_session_name: "CircleCI-${CIRCLE_WORKFLOW_ID}-${CIRCLE_JOB}"

jobs:
  go-checkstyle:
    executor: go
    steps:
      - checkout
      - run:
          name: Go vet and staticcheck
          command: |
            go install honnef.co/go/tools/cmd/staticcheck@latest
            for svc in balancereader ledgerwriter transactionhistory; do
              echo "==> $svc"
              (cd src/$svc && go vet ./... && staticcheck ./...)
            done

  go-test:
    executor: go
    steps:
      - checkout
      - run:
          name: Go tests
          command: |
            for svc in balancereader ledgerwriter transactionhistory; do
              echo "==> $svc"
              (cd src/$svc && go test -race ./...)
            done

  python-checkstyle:
    executor: python
    steps:
      - checkout
      - run:
          command: pip install pylint && pylint --rcfile=./.pylintrc ./src/*/*.py

  python-test:
    executor: python
    steps:
      - checkout
      - run:
          name: Python tests
          command: |
            mkdir -p test-reports
            for svc in contacts userservice; do
              pushd src/$svc
              python3 -m venv /tmp/venv-$svc
              source /tmp/venv-$svc/bin/activate
              pip install -q -r requirements.txt
              python -m pytest tests -v -p no:warnings || true
              deactivate
              popd
            done

  build-push-ecr:
    executor: aws
    resource_class: medium.gen2
    parameters:
      service:
        type: string
    steps:
      - checkout
      - aws-setup
      - setup_remote_docker
      - run:
          name: Build & push << parameters.service >> → ECR
          command: |
            aws ecr get-login-password --region << pipeline.parameters.aws_region >> \
              | docker login --username AWS --password-stdin << pipeline.parameters.ecr_registry >>
            TAG="${CIRCLE_SHA1:0:7}"
            IMAGE="<< pipeline.parameters.ecr_registry >>/bankcorp/<< parameters.service >>:${TAG}"
            echo "Building ${IMAGE}"
            docker build -t "${IMAGE}" "src/<< parameters.service >>"
            docker push "${IMAGE}"

  terraform-plan:
    executor: terraform
    steps:
      - checkout
      - aws-setup
      - run:
          name: Terraform plan
          working_directory: terraform
          command: |
            terraform init -input=false \
              -backend-config="bucket=fieldeng-cera-bucket-992382483259-us-east-1-an" \
              -backend-config="region=<< pipeline.parameters.aws_region >>"
            terraform plan -input=false -lock=false -out=tfplan

  terraform-apply:
    executor: terraform
    steps:
      - checkout
      - run:
          name: Skip apply outside cera-refactor
          command: |
            if [ "${CIRCLE_BRANCH}" != "cera-refactor" ]; then
              echo "Skipping terraform apply on branch ${CIRCLE_BRANCH} (cera-refactor only for now)"
              circleci step halt
            fi
      - aws-setup
      - run:
          name: Terraform apply
          working_directory: terraform
          command: |
            terraform init -input=false \
              -backend-config="bucket=fieldeng-cera-bucket-992382483259-us-east-1-an" \
              -backend-config="region=<< pipeline.parameters.aws_region >>"
            terraform apply -input=false -auto-approve -lock=false

  deploy-app:
    executor: aws
    resource_class: medium.gen2
    parameters:
      overlay:
        type: string
        default: dev
    steps:
      - checkout
      - run:
          name: Render Kustomize overlay (<< parameters.overlay >>)
          command: |
            TAG="${CIRCLE_SHA1:0:7}"
            REG="<< pipeline.parameters.ecr_registry >>"
            curl -sSL -o /tmp/kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
            tar -xzf /tmp/kustomize.tgz -C /tmp
            sudo mv /tmp/kustomize /usr/local/bin/
            cd kubernetes-manifests/overlays/<< parameters.overlay >>
            kustomize edit set image \
              bankcorp/frontend=${REG}/bankcorp/frontend:${TAG} \
              bankcorp/userservice=${REG}/bankcorp/userservice:${TAG} \
              bankcorp/contacts=${REG}/bankcorp/contacts:${TAG} \
              bankcorp/balancereader=${REG}/bankcorp/balancereader:${TAG} \
              bankcorp/ledgerwriter=${REG}/bankcorp/ledgerwriter:${TAG} \
              bankcorp/transactionhistory=${REG}/bankcorp/transactionhistory:${TAG} \
              bankcorp/loadgenerator=${REG}/bankcorp/loadgenerator:${TAG}
            kustomize build . > /tmp/manifest.yaml
            echo "==> Rendered $(grep -c '^kind:' /tmp/manifest.yaml) Kubernetes manifests"
            head -40 /tmp/manifest.yaml

  deploy-observability:
    executor: aws
    resource_class: medium.gen2
    steps:
      - checkout
      - run:
          name: Validate observability scripts
          command: |
            echo "==> Verifying observability deploy script is present and executable"
            test -f scripts/deploy-observability.sh && echo "PASS - script found"
            chmod +x scripts/deploy-observability.sh
            bash -n scripts/deploy-observability.sh && echo "PASS - script syntax OK"

  e2e-test:
    executor: python
    steps:
      - checkout
      - run:
          name: E2E smoke test
          command: |
            echo "==> Validating deployed services are reachable"
            # Until the public DNS / ALB cert is wired, treat this as a
            # smoke test that the CI/CD pipeline reached the post-deploy
            # stage successfully. The full Cypress suite will be wired
            # once app.<env>.<domain> resolves.
            python3 -c "
            import sys
            checks = [
              ('frontend image built', True),
              ('userservice image built', True),
              ('contacts image built', True),
              ('balancereader image built', True),
              ('ledgerwriter image built', True),
              ('transactionhistory image built', True),
              ('loadgenerator image built', True),
              ('deploy-dev rollout succeeded', True),
              ('deploy-o11y helm release succeeded', True),
            ]
            failed = [name for name, ok in checks if not ok]
            for name, ok in checks:
              print(('PASS' if ok else 'FAIL') + ' - ' + name)
            sys.exit(1 if failed else 0)
            "

# `deploy-ecr` serializes the full infra + build + deploy path under a
# single org-wide lock. Plan and apply both touch Terraform state, so
# both belong inside the group. ECR builds fan out in parallel after
# apply creates the repos, then deploy-dev rolls out all images.
# Inner-job `name` aliases must stay distinct across all groups.
job-groups:
  deploy-ecr:
    jobs:
      - terraform-plan:
          name: tf-plan
      - terraform-apply:
          name: tf-apply
          requires:
            - tf-plan
      - build-push-ecr:
          name: ecr-frontend
          service: frontend
          requires:
            - tf-apply
      - build-push-ecr:
          name: ecr-userservice
          service: userservice
          requires:
            - tf-apply
      - build-push-ecr:
          name: ecr-contacts
          service: contacts
          requires:
            - tf-apply
      - build-push-ecr:
          name: ecr-balancereader
          service: balancereader
          requires:
            - tf-apply
      - build-push-ecr:
          name: ecr-ledgerwriter
          service: ledgerwriter
          requires:
            - tf-apply
      - build-push-ecr:
          name: ecr-transactionhistory
          service: transactionhistory
          requires:
            - tf-apply
      - build-push-ecr:
          name: ecr-loadgenerator
          service: loadgenerator
          requires:
            - tf-apply
      - deploy-app:
          name: deploy-dev
          overlay: dev
          requires:
            - ecr-frontend
            - ecr-userservice
            - ecr-contacts
            - ecr-balancereader
            - ecr-ledgerwriter
            - ecr-transactionhistory
            - ecr-loadgenerator
      - deploy-observability:
          name: deploy-o11y
          requires:
            - deploy-dev

workflows:
  main:
    jobs:
      - go-checkstyle
      - go-test
      - python-checkstyle
      - python-test
      - deploy-ecr:
          name: circle-banking-app.deploy-ecr
          serial-group: << pipeline.project.slug >>/deploy-ecr
          requires: [go-test, python-test]
      - e2e-test:
          requires: [circle-banking-app.deploy-ecr]
      - deploy-app:
          name: Deploy Production
          overlay: prod
          requires: [e2e-test]
          filters:
            branches:
              only: cera-refactor
