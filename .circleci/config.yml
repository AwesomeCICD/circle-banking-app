version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1

parameters:
  ecr_registry:
    type: string
    default: "992382483259.dkr.ecr.us-east-1.amazonaws.com"
  eks_cluster_name:
    type: string
    default: "fe-runner-cluster"
  aws_region:
    type: string
    default: "us-east-1"
  k8s_namespace:
    type: string
    default: "bankcorp"
  domain:
    type: string
    default: "bankapp.example.com"
  app_environment:
    type: string
    default: "dev"
  aws_ci_role_arn:
    type: string
    default: "arn:aws:iam::992382483259:role/fieldeng_aws_ci_oidc_oauth_role"
  app_role_arn:
    type: string
    default: "arn:aws:iam::992382483259:role/fe-runner-cluster-app-dynamodb"
  acm_cert_arn:
    type: string
    default: ""

executors:
  with-chrome:
    docker:
      - image: cypress/browsers:node-22.14.0-chrome-133.0.6943.126-1-ff-135.0.1-edge-133.0.3065.82-1
  aws:
    docker:
      - image: cimg/aws:2024.03
  go:
    docker:
      - image: cimg/go:1.22
  python:
    docker:
      - image: cimg/python:3.10
  terraform:
    docker:
      - image: hashicorp/terraform:1.7

commands:
  aws-setup:
    steps:
      - aws-cli/setup:
          region: << pipeline.parameters.aws_region >>
          role_arn: << pipeline.parameters.aws_ci_role_arn >>
          role_session_name: "CircleCI-${CIRCLE_WORKFLOW_ID}-${CIRCLE_JOB}"

jobs:
  go-checkstyle:
    executor: go
    steps:
      - checkout
      - run:
          name: Go vet and staticcheck
          command: |
            go install honnef.co/go/tools/cmd/staticcheck@latest
            for svc in balancereader ledgerwriter transactionhistory; do
              echo "==> $svc"
              (cd src/$svc && go vet ./... && staticcheck ./...)
            done

  go-test:
    executor: go
    steps:
      - checkout
      - run:
          name: Go tests
          command: |
            for svc in balancereader ledgerwriter transactionhistory; do
              echo "==> $svc"
              (cd src/$svc && go test -race ./...)
            done

  python-checkstyle:
    executor: python
    steps:
      - checkout
      - run:
          command: pip install pylint && pylint --rcfile=./.pylintrc ./src/*/*.py

  python-test:
    executor: python
    steps:
      - checkout
      - run:
          name: Python tests
          command: |
            mkdir -p test-reports
            for svc in contacts userservice; do
              pushd src/$svc
              python3 -m venv /tmp/venv-$svc
              source /tmp/venv-$svc/bin/activate
              pip install -q -r requirements.txt
              python -m pytest tests -v -p no:warnings || true
              deactivate
              popd
            done

  build-push-ecr:
    executor: aws
    parameters:
      service:
        type: string
    steps:
      - checkout
      - aws-setup
      - setup_remote_docker
      - run:
          name: Build & push << parameters.service >> → ECR
          command: |
            aws ecr get-login-password --region << pipeline.parameters.aws_region >> \
              | docker login --username AWS --password-stdin << pipeline.parameters.ecr_registry >>
            TAG="${CIRCLE_SHA1:0:7}"
            IMAGE="<< pipeline.parameters.ecr_registry >>/bankcorp/<< parameters.service >>:${TAG}"
            echo "Building ${IMAGE}"
            docker build -t "${IMAGE}" "src/<< parameters.service >>"
            docker push "${IMAGE}"

  terraform-plan:
    executor: terraform
    steps:
      - checkout
      - aws-setup
      - run:
          working_directory: terraform
          command: |
            terraform init -input=false
            terraform plan -input=false -out=tfplan

  terraform-apply:
    executor: terraform
    steps:
      - checkout
      - run:
          name: Skip apply outside cera-refactor
          command: |
            if [ "${CIRCLE_BRANCH}" != "cera-refactor" ]; then
              echo "Skipping terraform apply on branch ${CIRCLE_BRANCH} (cera-refactor only for now)"
              circleci step halt
            fi
      - aws-setup
      - run:
          working_directory: terraform
          command: |
            terraform init -input=false
            terraform apply -input=false -auto-approve
      - run:
          name: Seed DynamoDB demo data
          command: |
            pip install boto3 bcrypt
            ENVIRONMENT=<< pipeline.parameters.app_environment >> \
            AWS_REGION=<< pipeline.parameters.aws_region >> \
              python scripts/seed-dynamodb.py

  deploy-app:
    executor: aws
    parameters:
      overlay:
        type: string
        default: dev
    steps:
      - checkout
      - aws-setup
      - run:
          name: Configure kubectl
          command: |
            aws eks update-kubeconfig \
              --name << pipeline.parameters.eks_cluster_name >> \
              --region << pipeline.parameters.aws_region >>
      - run:
          name: Sync JWT keys from Secrets Manager
          command: |
            PUB=$(aws secretsmanager get-secret-value --secret-id bankcorp/jwt-public-key --query SecretString --output text)
            PRIV=$(aws secretsmanager get-secret-value --secret-id bankcorp/jwt-private-key --query SecretString --output text)
            kubectl create namespace << pipeline.parameters.k8s_namespace >> --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n << pipeline.parameters.k8s_namespace >> create secret generic jwt-keys \
              --from-literal=publickey="${PUB}" \
              --from-literal=privatekey="${PRIV}" \
              --dry-run=client -o yaml | kubectl apply -f -
      - run:
          name: Deploy with Kustomize
          command: |
            TAG="${CIRCLE_SHA1:0:7}"
            REG="<< pipeline.parameters.ecr_registry >>"
            WORKDIR=$(mktemp -d)
            cp -r kubernetes-manifests/overlays/<< parameters.overlay >> "${WORKDIR}/overlay"
            cd "${WORKDIR}/overlay"
            kustomize edit set image bankcorp/frontend=${REG}/bankcorp/frontend:${TAG}
            kustomize edit set image bankcorp/userservice=${REG}/bankcorp/userservice:${TAG}
            kustomize edit set image bankcorp/contacts=${REG}/bankcorp/contacts:${TAG}
            kustomize edit set image bankcorp/balancereader=${REG}/bankcorp/balancereader:${TAG}
            kustomize edit set image bankcorp/ledgerwriter=${REG}/bankcorp/ledgerwriter:${TAG}
            kustomize edit set image bankcorp/transactionhistory=${REG}/bankcorp/transactionhistory:${TAG}
            kustomize edit set image bankcorp/loadgenerator=${REG}/bankcorp/loadgenerator:${TAG}
            MANIFEST=$(kustomize build .)
            APP_ROLE="<< pipeline.parameters.app_role_arn >>"
            ACM_ARN="<< pipeline.parameters.acm_cert_arn >>"
            if [[ -n "${APP_ROLE}" ]]; then
              MANIFEST=$(echo "${MANIFEST}" | sed "s|PLACEHOLDER_IAM_ROLE_ARN|${APP_ROLE}|g")
            fi
            if [[ -n "${ACM_ARN}" ]]; then
              MANIFEST=$(echo "${MANIFEST}" | sed "s|PLACEHOLDER_ACM_CERT_ARN|${ACM_ARN}|g")
            fi
            echo "${MANIFEST}" | kubectl apply -f -
      - run:
          name: Wait for rollouts
          command: |
            NS="<< pipeline.parameters.k8s_namespace >>"
            for dep in frontend userservice contacts balancereader ledgerwriter transactionhistory; do
              kubectl rollout status deployment/${dep} -n ${NS} --timeout=180s
            done

  deploy-observability:
    executor: aws
    steps:
      - checkout
      - aws-setup
      - run:
          name: Configure kubectl and Helm
          command: |
            aws eks update-kubeconfig \
              --name << pipeline.parameters.eks_cluster_name >> \
              --region << pipeline.parameters.aws_region >>
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - run:
          name: Install observability stack
          command: |
            chmod +x scripts/deploy-observability.sh
            K8S_NAMESPACE=<< pipeline.parameters.k8s_namespace >> \
            AWS_REGION=<< pipeline.parameters.aws_region >> \
              ./scripts/deploy-observability.sh

  e2e-test:
    executor: with-chrome
    steps:
      - checkout
      - run:
          name: Cypress E2E
          command: |
            URL="https://app.<< pipeline.parameters.app_environment >>.<< pipeline.parameters.domain >>"
            cd ui-tests
            npx cypress run --config baseUrl="${URL}" --browser firefox

# `deploy-ecr` serializes the full infra + build + deploy path under a
# single org-wide lock. Plan and apply both touch Terraform state, so
# both belong inside the group. ECR builds fan out in parallel after
# apply creates the repos, then deploy-dev rolls out all images.
# Inner-job `name` aliases must stay distinct across all groups.
job-groups:
  deploy-ecr:
    jobs:
      - terraform-plan:
          name: tf-plan
      - terraform-apply:
          name: tf-apply
          requires:
            - tf-plan
      - build-push-ecr:
          name: ecr-frontend
          service: frontend
          requires:
            - tf-apply
      - build-push-ecr:
          name: ecr-userservice
          service: userservice
          requires:
            - tf-apply
      - build-push-ecr:
          name: ecr-contacts
          service: contacts
          requires:
            - tf-apply
      - build-push-ecr:
          name: ecr-balancereader
          service: balancereader
          requires:
            - tf-apply
      - build-push-ecr:
          name: ecr-ledgerwriter
          service: ledgerwriter
          requires:
            - tf-apply
      - build-push-ecr:
          name: ecr-transactionhistory
          service: transactionhistory
          requires:
            - tf-apply
      - build-push-ecr:
          name: ecr-loadgenerator
          service: loadgenerator
          requires:
            - tf-apply
      - deploy-app:
          name: deploy-dev
          overlay: dev
          requires:
            - ecr-frontend
            - ecr-userservice
            - ecr-contacts
            - ecr-balancereader
            - ecr-ledgerwriter
            - ecr-transactionhistory
            - ecr-loadgenerator
      - deploy-observability:
          name: deploy-o11y
          requires:
            - deploy-dev

workflows:
  main:
    jobs:
      - go-checkstyle
      - go-test
      - python-checkstyle
      - python-test
      - deploy-ecr:
          name: circle-banking-app.deploy-ecr
          serial-group: << pipeline.project.slug >>/deploy-ecr
          requires: [go-test, python-test]
      - e2e-test
      - deploy-app:
          name: Deploy Production
          overlay: prod
          requires: [e2e-test]
          filters:
            branches:
              only: main
