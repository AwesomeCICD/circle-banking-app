version: 2.1
setup: true

orbs:
  path-filtering: circleci/path-filtering@3.0.0
  continuation: circleci/continuation@2.0.1
  circleci-cli: circleci/circleci-cli@0.1.11

# Like Freshpaint, the setup config chooses and validates the continuation.
# API-triggered deploy parameters are declared again in deploy-only-config.yml,
# but are not passed through /tmp/pipeline-parameters.json.
parameters:
  always-continue:
    type: boolean
    default: false
  deploy-only:
    type: boolean
    default: false
  deploy-action:
    type: string
    default: redeploy
  artifact-ref:
    type: string
    default: ""

jobs:
  setup:
    executor: path-filtering/default
    resource_class: medium
    steps:
      - checkout
      - circleci-cli/install:
          version: "v0.1.38646"

      # A deploy-only request bypasses path filtering and the normal test config.
      - when:
          condition: << pipeline.parameters.deploy-only >>
          steps:
            - run:
                name: Stage deploy-only configuration
                command: cp .circleci/deploy-only-config.yml /tmp/deploy-only-config.yml
            - run:
                name: Validate deploy-only configuration
                command: circleci config validate /tmp/deploy-only-config.yml
            - continuation/continue:
                configuration_path: /tmp/deploy-only-config.yml

      # Normal pipelines retain Freshpaint's pack -> path-filter -> validate ->
      # continue flow.
      - unless:
          condition: << pipeline.parameters.deploy-only >>
          steps:
            - run:
                name: Pack shared configuration
                command: circleci config pack .circleci/shared > .circleci/shared-config.yml
            - path-filtering/set-parameters:
                base-revision: main
                config-path: .circleci/no-updates.yml
                mapping: |
                  .* always-continue true .circleci/shared-config.yml
            - path-filtering/generate-config
            - run:
                name: Validate generated config
                command: circleci config validate /tmp/generated-config.yml
            - continuation/continue:
                configuration_path: /tmp/generated-config.yml
                parameters: /tmp/pipeline-parameters.json

workflows:
  setup:
    jobs:
      - setup
