# [START dev_kubernetes_manifests_ledger_db_statefulset_ledger_db]
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: ledger-db
spec:
  serviceName: "ledger-db"
  replicas: 1
  selector:
    matchLabels:
      app: ledger-db
  template:
    metadata:
      labels:
        app: ledger-db
    spec:
      serviceAccountName: default
      containers:
        - name: postgres
          image: cera-ledger-db
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: environment-config
            - secretRef:
                name: ledger-db-secret
            - configMapRef:
                name: demo-data-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: postgresdb
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: postgresdb
          emptyDir: {}
# [END dev_kubernetes_manifests_ledger_db_statefulset_ledger_db]
---
# Default dev secret -- override per-cluster via Kustomize overlays or ExternalSecrets
apiVersion: v1
kind: Secret
metadata:
  name: ledger-db-secret
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_DB: postgresdb
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: password
  SPRING_DATASOURCE_URL: jdbc:postgresql://ledger-db:5432/postgresdb
  SPRING_DATASOURCE_USERNAME: admin
  SPRING_DATASOURCE_PASSWORD: password
# [END dev_kubernetes_manifests_ledger_db_secret]
---
# [START dev_kubernetes_manifests_ledger_db_service_ledger_db]
apiVersion: v1
kind: Service
metadata:
  name: ledger-db
spec:
  type: ClusterIP
  selector:
    app: ledger-db
  ports:
  - name: tcp
    port: 5432
    targetPort: 5432
# [END dev_kubernetes_manifests_ledger_db_service_ledger_db]
